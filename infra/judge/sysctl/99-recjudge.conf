# REC Code judge host — kernel hardening. Installed to /etc/sysctl.d/ by
# infra/judge/cloud-init.yaml and checked by infra/judge/verify-host.sh,
# which the worker unit runs before every start. Change this file and
# verify-host.sh together; see docs/JUDGE.md ("Host hardening").
#
# None of these settings is needed by isolate itself (it runs setuid root and
# uses mount, IPC, network and PID namespaces, never user namespaces). Each
# one removes kernel attack surface a hostile submission could reach.

# No unprivileged user namespaces (Debian/Ubuntu kernel patch; production
# judges run the Ubuntu kernel, where this key exists).
kernel.unprivileged_userns_clone = 0

# eBPF: unprivileged bpf() off (2 = off, still changeable by root), JIT
# hardened for every caller.
kernel.unprivileged_bpf_disabled = 2
net.core.bpf_jit_harden = 2

# io_uring off for every process (kernel >= 6.6). isolate also filters it
# per box (syscall_flags bit 8); this is the host-wide second layer.
kernel.io_uring_disabled = 2

# Kernel log and kernel pointers hidden from unprivileged users.
kernel.dmesg_restrict = 1
kernel.kptr_restrict = 2

# perf_event_open() denied to unprivileged users.
kernel.perf_event_paranoid = 3

# Yama: no process may ptrace another (3 = no attach, irreversible until
# reboot). Nothing on a judge host needs a debugger.
kernel.yama.ptrace_scope = 3

# userfaultfd() only for privileged callers (a classic race-widening
# primitive in kernel exploits).
vm.unprivileged_userfaultfd = 0

# Link-following protections in world-writable sticky directories.
fs.protected_symlinks = 1
fs.protected_hardlinks = 1

# No core dumps from setuid binaries, and no core dumps at all: a crashing
# program's memory never reaches disk (the boxes also run with core size 0).
fs.suid_dumpable = 0
kernel.core_pattern = |/bin/false

# kernel.modules_disabled = 1 is deliberately NOT set here. It is one-way
# (no module can load until reboot), and systemd-sysctl runs early in boot,
# before nftables and the cgroup/tmpfs units have loaded their modules. It is
# set LAST in boot by recjudge-modules-lock.service (written by
# cloud-init.yaml), ordered after nftables.service, isolate.service and the
# box-root mount, and before recjudge-worker.service. verify-host.sh checks
# it together with the keys above.
