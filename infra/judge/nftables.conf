#!/usr/sbin/nft -f
# REC Code judge host — firewall. Installed to /etc/nftables.conf by
# infra/judge/cloud-init.yaml, which substitutes the placeholders below with
# IPv4 addresses (never hostnames: there is no DNS egress at all, and the
# app's hostname is pinned in /etc/hosts instead).
#
#   @APP_HOST@    the app host (Caddy → apps/web /api/judge/*, HTTPS 443; it
#                 also serves NTP to the judge subnet)
#   @REDIS_HOST@  the Redis host (BullMQ queues + progress pub/sub, 6379)
#   @ADMIN_CIDR@  the operators' network allowed to SSH in
#
# A judge host is credential-free and disposable; this file limits what a
# host compromised through a sandbox escape can reach. It is one layer of
# several (docs/JUDGE.md, "Layered containment"), not the sandbox itself.

flush ruleset

define APP_HOST = @APP_HOST@
define REDIS_HOST = @REDIS_HOST@
define ADMIN_CIDR = @ADMIN_CIDR@

table inet recjudge {
  chain input {
    type filter hook input priority filter; policy drop;
    iif "lo" accept
    ct state established,related accept
    ct state invalid drop
    ip saddr $ADMIN_CIDR tcp dport 22 ct state new accept
    # DHCP replies (see the output chain).
    udp sport 67 udp dport 68 accept
  }

  # A judge host routes nothing.
  chain forward {
    type filter hook forward priority filter; policy drop;
  }

  chain output {
    type filter hook output priority filter; policy drop;

    # Sandbox uids (isolate first_uid 60000; slot boxes use 60000-60299 of
    # the 60000-60999 range) never get a packet out, whatever matches below.
    # Boxes run in their own network namespace, whose only interface is a
    # DOWN loopback, so their traffic never reaches this hook at all; this
    # rule is the second layer for a namespace that is ever shared by mistake.
    meta skuid 60000-60999 counter drop

    # Cloud instance metadata (credentials, user-data) is unreachable from
    # the host once it has booted. Dropped before "established" so even a
    # connection opened during first boot is cut.
    ip daddr 169.254.169.254 counter drop

    oif "lo" accept
    ct state established,related accept
    ct state invalid drop

    # The worker's only destinations.
    ip daddr $APP_HOST tcp dport 443 ct state new accept
    ip daddr $APP_HOST udp dport 123 accept
    ip daddr $REDIS_HOST tcp dport 6379 ct state new accept

    # Link-level housekeeping, not a destination: DHCP lease renewals, without
    # which the host loses its address when the lease runs out. Source port 68
    # is privileged, and the sandbox uids were already dropped above.
    udp sport 68 udp dport 67 accept

    # Everything else falls to the drop policy; log a sample of it.
    limit rate 10/minute log prefix "recjudge-egress-drop " level warn
  }
}
