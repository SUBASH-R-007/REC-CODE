# REC Code judge host — kernel modules that must never load. Installed to
# /etc/modprobe.d/ by infra/judge/cloud-init.yaml.
#
# "install <module> /bin/false" (rather than "blacklist") also refuses
# explicit loads and loads triggered as a dependency or by a socket()
# family request, which is how unprivileged code usually pulls in a rarely
# used, historically vulnerable protocol or filesystem. Once the host has
# booted, recjudge-modules-lock.service sets kernel.modules_disabled = 1 and
# no module can load at all; this file covers the window before that.
#
# A filesystem compiled into the kernel (=y rather than =m) is not affected
# by modprobe rules; the list matters for modular builds. squashfs is listed
# although snaps mount it: cloud-init purges snapd from judge hosts first.

# Rare network protocols (each has had local privilege-escalation CVEs).
install dccp /bin/false
install sctp /bin/false
install rds /bin/false
install tipc /bin/false
install n-hdlc /bin/false

# Rare filesystems a crafted image could exercise.
install cramfs /bin/false
install freevxfs /bin/false
install jffs2 /bin/false
install hfs /bin/false
install hfsplus /bin/false
install squashfs /bin/false
install udf /bin/false
