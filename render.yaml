# REC Code — a TEMPORARY hosted test deployment, on Render's free tiers
# only. Not the production topology: that is deploy/compose.*.yml on a Linux
# server, and docs/DEPLOY-HOSTED-TEST.md explains every difference —
# including the one that matters most, that nothing here can judge a
# submission, because isolate needs a setuid sandbox and cgroup v2 on a host
# you control.
#
# What this blueprint creates, and nothing else:
#   recx-db     PostgreSQL 17  — the database (Postgres is truth)
#   recx-redis  Key Value      — BullMQ queues and the rate limiter only
#
# The web app is NOT here: it is deployed to Vercel from apps/web
# (apps/web/vercel.json), which is where the secrets live.
#
# THE SCHEDULER IS NOT HERE EITHER, and that is a deliberate hole with a
# cost. Render has no free plan for a background worker — free covers web
# services and static sites — and a free web service sleeps after fifteen
# minutes without traffic, which for a process whose whole job is to tick is
# worse than not running it at all. So nothing ticks in this deployment
# unless you tick it yourself: no reconciler re-enqueueing a lost job, no
# judge node ever marked OFFLINE, no daily challenge, no leaderboard freeze,
# no contest ranking, no attempt or integrity sweep, no inactivity sweep, no
# readiness snapshot, no email drain. §3.3 of that document lists them with
# what each one's absence looks like, and gives two free ways to run a tick
# (`node apps/scheduler/dist/main.js --once`) — from your own machine while
# you are testing, or from a scheduled GitHub Actions workflow.
#
# NOT RUN HERE. This file has never been applied: it is written from
# Render's blueprint reference, and the first apply is the test of it.

databases:
  - name: recx-db
    databaseName: recx
    user: recx
    plan: free
    postgresMajorVersion: "17"
    # Free Postgres is DELETED after 30 days. Acceptable for a fortnight of
    # testing and unacceptable for anything else; §2.13 of the runbook covers
    # backups on the real server.
    #
    # Open to the internet because every client is outside Render: Vercel's
    # functions, and the migrations and seed you run from your own machine.
    # The password is the only thing standing in front of it, so treat this
    # database as public and put nothing real in it.
    ipAllowList:
      - source: 0.0.0.0/0
        description: Vercel's functions, plus migrations and the seed from your machine

services:
  # Transport only. A flush loses queue position and zero submissions,
  # because the reconciler re-enqueues from Postgres (§2.1) — which is why
  # free Key Value having no persistence is survivable, and why a tick from
  # somewhere is still worth arranging.
  - type: keyvalue
    name: recx-redis
    plan: free
    region: singapore
    # BullMQ refuses to run against an evicting Redis: a dropped key is a
    # lost job. noeviction turns a full instance into write errors the
    # reconciler recovers from instead of silent loss.
    maxmemoryPolicy: noeviction
    # Also reached from outside Render (Vercel, and a judge worker on your
    # own machine if you attach one), so it cannot be internal-only.
    ipAllowList:
      - source: 0.0.0.0/0
        description: Vercel's functions, and a judge worker you attach from outside
