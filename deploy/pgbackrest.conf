; REC Code — pgBackRest, on the database host (Phase 10e).
;
; RPO 5 minutes, RTO 2 hours, from SPEC §10. Not run here: there is one
; laptop and no offsite anything. docs/RUNBOOK.md §3 records it as NOT RUN
; with what would have to be true to run it. What DOES run here is the
; restore drill against a local dump (scripts/ops/restore-drill.sh), which
; is the part that gets skipped everywhere else.
;
; Two things in this file are the whole point:
;
;   1. `repo1-cipher-type=aes-256-cbc` — the repository is encrypted BEFORE
;      it leaves the host. An offsite backup is a copy of every submission,
;      every attempt and every audit row sitting on somebody else's disk;
;      encrypting it at the destination would mean trusting the destination.
;   2. The retention numbers are the DPDP schedule's, not "forever". A
;      backup that outlives the retention policy is a copy of data the
;      platform has promised to delete — which is why 12 monthly is a
;      ceiling rather than a floor.
;
; Secrets (the cipher passphrase, the S3 keys) are NOT here. pgBackRest reads
; them from the environment, which compose.db.yml fills from Docker secrets
; decrypted on the host by sops+age at deploy time:
;
;   PGBACKREST_REPO1_CIPHER_PASS
;   PGBACKREST_REPO1_S3_KEY
;   PGBACKREST_REPO1_S3_KEY_SECRET
;
; tests/repo/ refuses a committed secret, and nothing in this directory is
; one.

[global]
; The local repository: a full plus its increments live here first, so a
; restore after a bad migration needs no network at all. The offsite copy is
; repo2, and the order matters — repo1 is what a 2-hour RTO depends on.
repo1-path=/var/lib/pgbackrest
repo1-retention-full=7
repo1-retention-diff=4
repo1-cipher-type=aes-256-cbc

; Offsite, encrypted before it leaves. Fill in the bucket and endpoint for
; the college's object store; the keys come from the environment.
repo2-type=s3
repo2-path=/recx
repo2-s3-bucket=${RECX_BACKUP_BUCKET}
repo2-s3-endpoint=${RECX_BACKUP_ENDPOINT}
repo2-s3-region=${RECX_BACKUP_REGION}
repo2-cipher-type=aes-256-cbc
; 7 daily / 4 weekly / 12 monthly, as the retention schedule says. pgBackRest
; counts FULL backups, so with a daily full this is seven days; the weekly
; and monthly copies are kept by the archive expiry below rather than by a
; second schedule, because two schedules that disagree is how a backup set
; disappears a month early.
repo2-retention-full=7
repo2-retention-full-type=count
repo2-retention-archive=7
repo2-retention-archive-type=full

; Parallelism and compression. zstd because it decompresses several times
; faster than gzip at the same ratio, and a restore is the operation whose
; speed is a promise (RTO 2 hours).
compress-type=zst
compress-level=6
process-max=4

; Verify every backup's checksums as it is written. A backup that cannot be
; restored is worse than no backup, because it is believed.
repo1-bundle=y
repo1-block=y
checksum-page=y
start-fast=y
archive-async=y
spool-path=/var/spool/pgbackrest
archive-get-queue-max=1GiB
archive-push-queue-max=4GiB

; Logs go to the container's stdout as well, so a failed archive-push is
; visible in `docker logs` rather than only in a file on the host.
log-level-console=info
log-level-file=detail
log-path=/var/log/pgbackrest

[recx]
pg1-path=/var/lib/postgresql/data
pg1-port=5432
pg1-user=recx
pg1-database=recx
